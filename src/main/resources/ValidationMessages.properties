# ===== CreateWalletRequest =====
wallet.userId.required=userId is required
wallet.userId.positive=userId must be positive

wallet.currency.required=currency is required
wallet.currency.pattern=currency must be a 3-letter code, e.g. KZT

# ===== UpdateStatusRequest =====
wallet.status.required=status is required

# ===== AmountRequest =====
wallet.amount.required=amount is required
wallet.amount.positive=amount must be positive
wallet.amount.digits=amount must have at most 2 decimal places

# ===== TransferRequest =====
wallet.transfer.fromWalletId.required=fromWalletId is required
wallet.transfer.fromWalletId.positive=fromWalletId must be positive

wallet.transfer.toWalletId.required=toWalletId is required
wallet.transfer.toWalletId.positive=toWalletId must be positive

wallet.transfer.amount.required=amount is required
wallet.transfer.amount.positive=amount must be positive
wallet.transfer.amount.digits=amount must have at most 2 decimal places