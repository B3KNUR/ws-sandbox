spring:
  profiles:
    active: "@spring.profiles.active@"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/wallet_db}
    username: ${DB_USERNAME:wallet}
    password: ${DB_PASSWORD:wallet}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true